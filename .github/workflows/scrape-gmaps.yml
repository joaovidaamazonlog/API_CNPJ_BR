name: Google Maps Scraper

on:
  schedule:
    # Batch 1 — 00:01 BRT (03:01 UTC): DSP2, DSP4, DSP5, DBR9
    - cron: '1 3 * * *'
    # Batch 2 — 02:00 BRT (05:00 UTC): DBS5, DPR2, DRS5, DBH5
    - cron: '0 5 * * *'
    # Batch 3 — 04:00 BRT (07:00 UTC): DMG2, DGO2, DCE3, DES2
    - cron: '0 7 * * *'
    # Batch 4 — 06:00 BRT (09:00 UTC): DPB3, DPE4, DRJ3, DSA8
    - cron: '0 9 * * *'
    # Batch 5 — 08:00 BRT (11:00 UTC): XBA1, XCP1, XCS1, XGA2
    - cron: '0 11 * * *'
    # Batch 6 — 10:00 BRT (13:00 UTC): XPB1, XRJ2, XRJ4, XSJ1
    - cron: '0 13 * * *'
    # Batch 7 — 12:00 BRT (15:00 UTC): XSP7, XSP9
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch a rodar (1-7). Deixe vazio para todas.'
        required: false
        default: ''
      stations:
        description: 'Sobrescrever estações manualmente (ex: DSP2 DBH5).'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: gmaps_scraper
        run: npm install

      - name: Resolver estações do batch
        id: resolve
        run: |
          BATCH_1="DSP2 DSP4 DSP5 DBR9"
          BATCH_2="DBS5 DPR2 DRS5 DBH5"
          BATCH_3="DMG2 DGO2 DCE3 DES2"
          BATCH_4="DPB3 DPE4 DRJ3 DSA8"
          BATCH_5="XBA1 XCP1 XCS1 XGA2"
          BATCH_6="XPB1 XRJ2 XRJ4 XSJ1"
          BATCH_7="XSP7 XSP9"
          HOUR=$(date -u +"%H")
          MIN=$(date -u +"%M")

          if [ -n "${{ github.event.inputs.stations }}" ]; then
            STATIONS="${{ github.event.inputs.stations }}"
          elif [ -n "${{ github.event.inputs.batch_id }}" ]; then
            case "${{ github.event.inputs.batch_id }}" in
              1) STATIONS="$BATCH_1" ;;
              2) STATIONS="$BATCH_2" ;;
              3) STATIONS="$BATCH_3" ;;
              4) STATIONS="$BATCH_4" ;;
              5) STATIONS="$BATCH_5" ;;
              6) STATIONS="$BATCH_6" ;;
              7) STATIONS="$BATCH_7" ;;
              *) STATIONS="" ;;
            esac
          else
            case "$HOUR" in
              03) STATIONS="$BATCH_1" ;;
              05) STATIONS="$BATCH_2" ;;
              07) STATIONS="$BATCH_3" ;;
              09) STATIONS="$BATCH_4" ;;
              11) STATIONS="$BATCH_5" ;;
              13) STATIONS="$BATCH_6" ;;
              15) STATIONS="$BATCH_7" ;;
              *)  STATIONS="" ;;
            esac
          fi

          echo "stations=$STATIONS" >> $GITHUB_OUTPUT
          echo "Estações selecionadas: $STATIONS"

      - name: Rodar scraper
        working-directory: gmaps_scraper
        run: |
          STATIONS="${{ steps.resolve.outputs.stations }}"
          if [ -n "$STATIONS" ]; then
            node run_batch.js --stations $STATIONS
          else
            node run_batch.js
          fi
        env:
          TURSO_URL:   ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
